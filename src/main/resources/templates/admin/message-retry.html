<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">

<section>
  <div class="card">
    <div class="hd">
      <h3>메시지 재시도 관리</h3>
      <div class="row">
        <span class="tag info">실패 메시지 목록</span>
        <span class="tag info">선택 재시도</span>
      </div>
    </div>

    <div class="bd">
      <div class="row" style="justify-content: space-between">
        <div class="subtle">
          FAILED 이면서 BILLING 목적이 아닌 메시지만 재시도할 수 있습니다.
        </div>
        <div class="row">
          <button class="btn primary" type="button" onclick="retrySelected()">
            선택 재시도
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ===== table ===== -->
      <div class="table-wrap">
        <table>
          <thead>
          <tr>
            <th class="nowrap">
              <input type="checkbox" id="checkAll"/>
            </th>
            <th class="nowrap">메시지 ID</th>
            <th class="nowrap">사용자 ID</th>
            <th class="nowrap">타입</th>
            <th>템플릿명</th>
            <th class="nowrap">현재 상태</th>
            <th class="right nowrap">재시도 횟수</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="row : ${messages}">
            <td>
              <input type="checkbox"
                     class="row-check"
                     th:value="${row.messageSendResultId}"/>
            </td>
            <td th:text="${row.messageSendResultId}"></td>
            <td th:text="${row.userId}"></td>
            <td>
              <span class="tag info" th:text="${row.channelCode}"></span>
            </td>
            <td th:text="${row.templateCode}"></td>
            <td>
              <span class="tag bad" th:text="${row.statusCode}"></span>
            </td>
            <td class="right" th:text="${row.retryCount}"></td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- ===== pagination ===== -->
      <div class="pagination">
        <div class="page-size">
          <span>페이지 크기</span>
          <select onchange="changeSize(this.value)">
            <option th:selected="${size == 50}" value="50">50</option>
            <option th:selected="${size == 100}" value="100">100</option>
            <option th:selected="${size == 200}" value="200">200</option>
          </select>
        </div>

        <div class="page-info">
          총 <span th:text="${total}"></span>건 중
          <span th:text="${start}"></span> -
          <span th:text="${end}"></span>건
        </div>

        <div class="page-nav">
          <button class="btn"
                  th:disabled="${messagePage.first}"
                  th:onclick="|location.href='?page=${page - 1}&size=${size}'|">
            이전
          </button>

          <button class="btn"
                  th:each="p : ${#numbers.sequence(0, messagePage.totalPages - 1)}"
                  th:classappend="${p == page} ? 'active'"
                  th:text="${p + 1}"
                  th:onclick="|location.href='?page=${p}&size=${size}'|">
          </button>

          <button class="btn"
                  th:disabled="${messagePage.last}"
                  th:onclick="|location.href='?page=${page + 1}&size=${size}'|">
            다음
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<th:block th:fragment="scripts">
  <script>
    // 현재 페이지 목록 전체 선택
    document.addEventListener('DOMContentLoaded', () => {
      const checkAll = document.getElementById('checkAll');

      if (!checkAll) return;

      checkAll.addEventListener('change', () => {
        document.querySelectorAll('.row-check').forEach(cb => {
          cb.checked = checkAll.checked;
        });
      });
    });

    function retrySelected() {
      const ids = Array.from(
        document.querySelectorAll('.row-check:checked')
      ).map(cb => Number(cb.value));

      if (ids.length === 0) {
        alert('재시도할 메시지를 선택하세요.');
        return;
      }

      if (!confirm(`${ids.length}건을 재시도하시겠습니까?`)) {
        return;
      }

      fetch('/api/admin/messages/retry', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ids)
      }).then(() => {
        alert('재시도 요청이 접수되었습니다.');
        location.reload();
      });
    }

    function changeSize(size) {
      location.href = `?page=0&size=${size}`;
    }
  </script>
</th:block>
</html>
