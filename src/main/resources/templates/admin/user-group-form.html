<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">
<section>
  <div class="card">
    <div class="hd">
      <h3>사용자 그룹 등록/수정</h3>
      <div class="row">
        <span class="tag info">그룹 코드/명/설명</span>
        <span class="tag info">사용자 검색 후 추가</span>
      </div>
    </div>
    <div class="bd">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div class="card">
          <div class="hd">
            <h4>그룹 정보</h4>
          </div>
          <div class="bd">
            <div class="form">
              <div class="field span-12">
                <label>그룹 코드</label>
                <input id="group-code"
                       placeholder="예: GRP-VIP-001"
                       th:value="${group != null ? group.code : ''}"/>
              </div>
              <div class="field span-12">
                <label>그룹명</label>
                <input id="group-name"
                       placeholder="예: VIP 고객"
                       th:value="${group != null ? group.groupName : ''}"/>
              </div>
              <div class="field span-12">
                <label>설명</label>
                <textarea id="group-description"
                          rows="4"
                          placeholder="그룹 설명을 입력하세요"
                          th:text="${group != null ? group.description : ''}"></textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="hd">
            <h4>사용자 조건으로 검색</h4>
          </div>
          <div class="bd">
            <div class="form">
              <div class="field span-4">
                <label>이름</label>
                <input id="search-name" placeholder="예: 김민지"/>
              </div>
              <div class="field span-4">
                <label>연락처</label>
                <input id="search-phone" placeholder="010-0000-0000"/>
              </div>
              <div class="field span-4">
                <label>요금제</label>
                <select id="search-plan">
                  <option value="">전체</option>
                  <option th:each="service : ${uplusServices}"
                          th:value="${service.code}"
                          th:text="${service.name}">
                  </option>
                </select>
              </div>
              <div class="field span-12">
                <div class="row" style="justify-content: flex-end">
                  <button id="search-users" class="btn" type="button">
                    검색
                  </button>
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="table-wrap">
              <table>
                <thead>
                <tr>
                  <th class="nowrap" style="width: 40px; text-align: center;">
                    <input type="checkbox" id="select-all-checkbox">
                  </th>
                  <th class="nowrap">이름</th>
                  <th>이메일</th>
                  <th class="nowrap">연락처</th>
                </tr>
                </thead>
                <tbody id="user-search-results">
                <tr>
                  <td class="nowrap" colspan="4" style="text-align: center">검색 결과가 없습니다.</td>
                </tr>
                </tbody>
              </table>
            </div>
            <div class="pagination" id="user-pagination-controls" style="display: none;">
              <div class="page-info">총 <span id="total-users">0</span>건 중 <span id="current-range">0-0</span>건</div>
              <div class="page-nav">
                <button class="btn" type="button" id="prev-page">이전</button>
                <div id="page-numbers" style="display: inline-flex; gap: 5px;"></div>
                <button class="btn" type="button" id="next-page">다음</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="row" style="justify-content: space-between">
        <a class="btn" th:href="@{/admin/user-groups}">목록으로</a>
        <div class="row">
          <a class="btn" th:href="@{/admin/user-groups}">
            취소
          </a>
          <button id="save-group" class="btn primary" type="button">
            저장
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
<th:block th:fragment="scripts">
  <script th:src="@{/js/admin/user-group-form.js}"></script>
</th:block>
</html>
