<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">

<section>
  <div class="card">

    <!-- ================= HEADER ================= -->
    <div class="hd">
      <h3>사용자 그룹 상세</h3>
      <div class="row">
        <span class="tag info"
              th:text="'그룹 코드: ' + ${group.code}">
        </span>
      </div>
    </div>

    <!-- ================= BODY ================= -->
    <div class="bd">
      <div style="display: flex; flex-direction: column; gap: 16px">

        <!-- ===== 그룹 기본 정보 ===== -->
        <div class="card">
          <div class="hd">
            <h4>기본 정보</h4>
          </div>
          <div class="bd">
            <div class="form">

              <div class="field span-12">
                <label>그룹 코드</label>
                <input th:value="${group.code}" disabled/>
              </div>

              <div class="field span-12">
                <label>그룹명</label>
                <input th:value="${group.groupName}" disabled/>
              </div>

              <div class="field span-12">
                <label>설명</label>
                <textarea rows="4"
                          disabled
                          th:text="${group.description}">
                </textarea>
              </div>

            </div>
          </div>
        </div>

        <!-- ===== 사용자 목록 ===== -->
        <div class="card">
          <div class="hd">
            <h4>사용자 구성</h4>
          </div>
          <div class="bd">

            <!-- ===== TABLE ===== -->
            <div class="table-wrap">
              <table>
                <thead>
                <tr>
                  <th class="nowrap">이름</th>
                  <th>이메일</th>
                  <th class="nowrap">연락처</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                  <td class="nowrap"
                      th:text="${user.name}">
                  </td>

                  <td>-</td>
                  <td class="nowrap">-</td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                  <td colspan="4" style="text-align:center">
                    등록된 사용자가 없습니다.
                  </td>
                </tr>
                </tbody>
              </table>
            </div>

            <!-- ===== PAGINATION ===== -->
            <div class="pagination">

              <div class="page-info"
                   th:text="|총 ${userPage.totalElements}건 중
              ${page * size + 1}-${userPage.numberOfElements + page * size}건|">
              </div>

              <div class="page-nav">
                <a class="btn"
                   th:if="${userPage.hasPrevious()}"
                   th:href="@{/admin/user-groups/{id}(id=${group.groupId}, page=${page-1}, size=${size})}">
                  이전
                </a>

                <span class="btn active"
                      th:text="${page + 1}">
                </span>

                <a class="btn"
                   th:if="${userPage.hasNext()}"
                   th:href="@{/admin/user-groups/{id}(id=${group.groupId}, page=${page+1}, size=${size})}">
                  다음
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ===== FOOTER BUTTONS ===== -->
      <div class="row" style="justify-content:flex-end">
        <a class="btn"
           th:href="@{/admin/user-groups}">
          목록으로
        </a>

        <a class="btn"
           th:href="@{/admin/user-groups/{id}/edit(id=${group.groupId})}">
          수정
        </a>
      </div>

    </div>
  </div>
</section>

  <th:block th:fragment="scripts"></th:block>
</html>
