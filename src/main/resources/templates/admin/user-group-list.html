<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">

<section>

  <div class="card">

    <!-- ===================== -->
    <!-- Header -->
    <!-- ===================== -->
    <div class="hd">
      <div>
        <h3>사용자 그룹 목록</h3>
        <div class="row">
          <span class="tag info">그룹 구성 관리</span>
          <span class="tag info">검색 및 상세 이동</span>
        </div>
      </div>
      <div class="row">
        <a class="btn primary"
           th:href="@{/admin/user-groups/new}">
          사용자 그룹 등록
        </a>
      </div>
    </div>

    <!-- ===================== -->
    <!-- Body -->
    <!-- ===================== -->
    <div class="bd">

      <!-- ===================== -->
      <!-- Search -->
      <!-- ===================== -->
      <form method="get" th:action="@{/admin/user-groups}">
        <div class="form">
          <div class="field span-12">
            <label>그룹 코드 / 그룹명</label>
            <input name="keyword"
                   th:value="${keyword}"
                   placeholder="예: GRP-VIP-001 또는 VIP 고객"/>
          </div>
          <div class="field span-12">
            <div class="row" style="justify-content: flex-end">
              <button class="btn" type="submit">검색</button>
            </div>
          </div>
        </div>
      </form>

      <div class="divider"></div>

      <!-- ===================== -->
      <!-- Table -->
      <!-- ===================== -->
      <div class="table-wrap">
        <table>
          <thead>
          <tr>
            <th class="nowrap">그룹 코드</th>
            <th>그룹명</th>
            <th class="nowrap">사용자 수</th>
            <th class="nowrap">액션</th>
          </tr>
          </thead>

          <tbody>
          <!-- 데이터 있음 -->
          <tr th:each="g : ${groups}">
            <td class="nowrap"
                style="font-family: var(--mono)"
                th:text="${g.code}">
            </td>

            <td th:text="${g.name}"></td>

            <td class="nowrap"
                th:text="${g.userCount + '명'}">
            </td>

            <td class="nowrap">
              <a class="btn"
                 th:href="@{/admin/user-groups/{id}(id=${g.groupId})}">
                상세
              </a>
              <a class="btn"
                 th:href="@{/admin/user-groups/{id}/edit(id=${g.groupId})}">
                수정
              </a>
            </td>
          </tr>

          <!-- 데이터 없음 -->
          <tr th:if="${#lists.isEmpty(groups)}">
            <td colspan="4" style="text-align:center;">
              조회된 사용자 그룹이 없습니다.
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- ===================== -->
      <!-- Pagination -->
      <!-- ===================== -->
      <div class="pagination">

        <!-- page size -->
        <div class="page-size">
          <span>페이지 크기</span>
          <select onchange="location.href=this.value">
            <option th:value="@{/admin/user-groups(page=0,size=20,keyword=${keyword})}"
                    th:selected="${size == 20}">
              20
            </option>
            <option th:value="@{/admin/user-groups(page=0,size=50,keyword=${keyword})}"
                    th:selected="${size == 50}">
              50
            </option>
            <option th:value="@{/admin/user-groups(page=0,size=100,keyword=${keyword})}"
                    th:selected="${size == 100}">
              100
            </option>
          </select>
        </div>

        <!-- page info -->
        <div class="page-info"
             th:text="|총 ${total}건 중 ${start}-${end}건|">
        </div>

        <!-- page nav -->
        <div class="page-nav">

          <a class="btn"
             th:if="${groupPage.hasPrevious()}"
             th:href="@{/admin/user-groups(page=${page-1},size=${size},keyword=${keyword})}">
            이전
          </a>

          <span class="btn active"
                th:text="${page + 1}">
          </span>

          <a class="btn"
             th:if="${groupPage.hasNext()}"
             th:href="@{/admin/user-groups(page=${page+1},size=${size},keyword=${keyword})}">
            다음
          </a>

        </div>
      </div>

    </div>
  </div>

</section>
  <th:block th:fragment="scripts"></th:block>
</html>
