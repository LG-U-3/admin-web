<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(
          ${title},
          ${pageTitle},
          ${activeKey},
          ${pageStatus},
          ~{::section},
          ~{::scripts}
      )}">

<section>
  <div class="card">
    <div class="hd">
      <h3>메시지 발송 이력 조회</h3>
      <div class="row">
        <span class="tag info">EMAIL / SMS</span>
        <span class="tag info">WAITING / PROCESSING / SUCCESS / FAILED / EXCEEDED</span>
      </div>
    </div>

    <div class="bd">

      <!-- ===== 검색 영역 ===== -->
      <form method="get" th:action="@{/admin/messages/history}">
        <div class="form">

          <div class="field span-3">
            <label>기간 시작</label>
            <input type="date" name="startDate"
                   th:value="${search.startDate}"/>
          </div>

          <div class="field span-3">
            <label>기간 종료</label>
            <input type="date" name="endDate"
                   th:value="${search.endDate}"/>
          </div>

          <div class="field span-3">
            <label>메시지 타입</label>
            <select name="channelCode">
              <option value="">전체</option>
              <option value="EMAIL" th:selected="${search.channelCode == 'EMAIL'}">EMAIL</option>
              <option value="SMS" th:selected="${search.channelCode == 'SMS'}">SMS</option>
            </select>
          </div>

          <div class="field span-3">
            <label>발송 상태</label>
            <select name="statusCode">
              <option value="">전체</option>
              <option value="WAITING" th:selected="${search.statusCode == 'WAITING'}">대기</option>
              <option value="PROCESSING" th:selected="${search.statusCode == 'PROCESSING'}">발송중
              </option>
              <option value="SUCCESS" th:selected="${search.statusCode == 'SUCCESS'}">성공</option>
              <option value="FAILED" th:selected="${search.statusCode == 'FAILED'}">실패</option>
              <option value="EXCEEDED" th:selected="${search.statusCode == 'EXCEEDED'}">자동재시도초과
              </option>
            </select>
          </div>

          <div class="field span-6">
            <label>사용자 ID</label>
            <input type="text" name="userId"
                   placeholder="예: 12345"
                   th:value="${search.userId}"/>
          </div>

          <div class="field span-6">
            <label>템플릿명</label>
            <input type="text" name="templateName"
                   placeholder="예: monthly_bill"
                   th:value="${search.templateName}"/>
          </div>

          <div class="field span-12">
            <div class="row" style="justify-content:flex-end">
              <button class="btn primary" type="submit">검색</button>
            </div>
          </div>
        </div>
      </form>

      <div class="divider"></div>

      <!-- ===== 결과 테이블 ===== -->
      <div class="table-wrap">
        <table>
          <thead>
          <tr>
            <th class="nowrap">메시지 ID</th>
            <th class="nowrap">사용자 ID</th>
            <th class="nowrap">타입</th>
            <th>템플릿명</th>
            <th class="nowrap">발송 상태</th>
            <th class="nowrap">발송 시각</th>
            <th class="right nowrap">재시도</th>
          </tr>
          </thead>

          <tbody>
          <tr th:if="${#lists.isEmpty(results)}">
            <td colspan="7" class="muted" style="text-align:center">
              조회 결과가 없습니다.
            </td>
          </tr>

          <tr th:each="row : ${results}">
            <td class="nowrap" th:text="${row.messageId}"></td>
            <td class="nowrap" th:text="${row.userId}"></td>

            <td>
              <span class="tag info" th:text="${row.channelCode}"></span>
            </td>

            <td th:text="${row.templateName}"></td>

            <td>
              <span class="tag"
                    th:classappend="${row.statusCode == 'SUCCESS' ? 'ok' :
                                     row.statusCode == 'PROCESSING' ? 'warn' :
                                     row.statusCode == 'WAITING' ? 'info' : 'bad'}"
                    th:text="${row.statusCode}">
              </span>
            </td>

            <td class="nowrap"
                th:text="${#temporals.format(row.displayTime, 'yyyy-MM-dd HH:mm:ss')}">
            </td>

            <td class="right" th:text="${row.retryCount}"></td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- ===== 페이지네이션 ===== -->
      <div class="pagination" th:if="${page.totalElements > 0}">
        <div class="page-info">
          총 <strong th:text="${page.totalElements}"></strong>건
        </div>
        <div class="page-nav" th:if="${page.totalPages > 1}">

          <!-- 이전 10 -->
          <a class="btn"
             th:if="${page.number >= 10}"
             th:href="@{/admin/messages/history(
       page=${(page.number / 10) * 10 - 1},
       size=${page.size},
       channelCode=${search.channelCode},
       statusCode=${search.statusCode},
       userId=${search.userId},
       templateName=${search.templateName},
       startDate=${search.startDate},
       endDate=${search.endDate}
     )}">
            이전 10
          </a>

          <!-- 페이지 번호 10개 -->
          <a class="btn"
             th:each="p : ${#numbers.sequence(
        (page.number / 10) * 10,
        T(java.lang.Math).min((page.number / 10) * 10 + 9, page.totalPages - 1)
     )}"
             th:classappend="${p == page.number} ? 'active'"
             th:text="${p + 1}"
             th:href="@{/admin/messages/history(
       page=${p},
       size=${page.size},
       channelCode=${search.channelCode},
       statusCode=${search.statusCode},
       userId=${search.userId},
       templateName=${search.templateName},
       startDate=${search.startDate},
       endDate=${search.endDate}
     )}">
          </a>

          <!-- 다음 10 -->
          <a class="btn"
             th:if="${(page.number / 10) * 10 + 10 < page.totalPages}"
             th:href="@{/admin/messages/history(
       page=${(page.number / 10) * 10 + 10},
       size=${page.size},
       channelCode=${search.channelCode},
       statusCode=${search.statusCode},
       userId=${search.userId},
       templateName=${search.templateName},
       startDate=${search.startDate},
       endDate=${search.endDate}
     )}">
            다음 10
          </a>

        </div>

      </div>

    </div>
  </div>
</section>

<th:block th:fragment="scripts"></th:block>
</html>
