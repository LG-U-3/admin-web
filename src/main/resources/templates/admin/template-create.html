<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">
<section>
  <div class="card">
    <div class="hd">
      <h3>템플릿 등록</h3>
      <div class="row">
        <span class="tag info">제목(EMAIL) / 본문 / 변수 목록 / 미리보기</span>
      </div>
    </div>
    <div class="bd">
      <form th:action="@{/admin/templates}" th:object="${templateRequest}" method="post">
        <div class="form">
          <div class="field span-4">
            <label>템플릿 타입</label>
            <select th:field="*{channelTypeId}" id="tplType">
              <option value="">선택하세요</option>
              <option th:each="type : ${channelTypes}" th:value="${type.id}"
                      th:text="${type.code}"></option>
            </select>
          </div>
          <div class="field span-4">
            <label>템플릿명</label>
            <input th:field="*{name}" placeholder="예: monthly_bill_v3" required/>
            <input type="hidden" th:field="*{code}" id="hiddenCode"/>
          </div>
          <div class="field span-4">
            <label>사용 여부</label>
            <select>
              <option selected>사용</option>
              <option>미사용</option>
            </select>
          </div>

          <div class="field span-12" id="emailSubjectField">
            <label>제목 (이메일)</label>
            <input th:field="*{title}" placeholder="[요금명세서] {billingMonth}월 청구 금액 안내"/>
          </div>

          <div class="field span-12">
            <label>본문</label>
            <textarea th:field="*{body}" id="tplBody" placeholder="템플릿 본문을 입력해주세요."></textarea>
          </div>

          <div class="field span-6">
            <label>변수 목록 (JSON 입력)</label>
            <textarea th:field="*{variablesJson}" id="variablesJson" class="code"
                      placeholder='{"userName": "홍길동", "billingMonth": "1"}'
                      style="height: 110px;"></textarea>
            <div class="help">
              변수 치환은 서버에서 템플릿 엔진 또는 자체 치환 로직으로 처리.
            </div>
          </div>

          <div class="field span-6">
            <label>미리보기</label>
            <div class="code" id="previewBox" style="height: 110px; overflow-y: auto;"></div>
            <div class="row" style="justify-content: flex-end; margin-top: 10px">
              <button class="btn" type="button" data-action="preview">
                미리보기 갱신
              </button>
            </div>
          </div>

          <div class="field span-12">
            <div class="row" style="justify-content: flex-end">
              <a class="btn" th:href="@{/admin/templates}">목록</a>
              <button class="btn primary" type="submit">
                등록
              </button>
            </div>
          </div>
        </div>
        <input type="hidden" name="purposeTypeId" value="1"/>
      </form>
    </div>
  </div>
</section>

<th:block th:fragment="scripts">
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const bodyArea = document.getElementById('tplBody');
      const variablesArea = document.getElementById('variablesJson');
      const previewBox = document.getElementById('previewBox');
      const previewBtn = document.querySelector('[data-action="preview"]');
      const nameInput = document.querySelector('input[name="name"]');
      const hiddenCode = document.getElementById('hiddenCode');

      // [기능 추가] 사용자가 입력한 JSON 값을 사용하여 실시간 치환
      if (previewBtn) {
        previewBtn.addEventListener('click', function() {
          let content = bodyArea.value;
          const jsonStr = variablesArea.value;

          if (!content.trim()) {
            previewBox.innerText = "본문 내용이 없습니다.";
            return;
          }

          try {
            if (jsonStr.trim()) {
              // 사용자가 입력한 JSON 파싱
              const userData = JSON.parse(jsonStr);

              // {key}를 사용자 입력값으로 치환
              Object.keys(userData).forEach(key => {
                const regex = new RegExp(`\\{${key}\\}`, 'g');
                content = content.replace(regex, userData[key]);
              });
            }
            previewBox.innerText = content;
          } catch (e) {
            alert("변수 목록(JSON) 형식이 올바르지 않습니다. 큰따옴표(\")를 사용했는지 확인하세요.");
          }
        });
      }

      if (nameInput && hiddenCode) {
        nameInput.addEventListener('input', () => hiddenCode.value = nameInput.value);
      }

      // 템플릿 타입에 따른 제목 필드 노출 제어
      const tplTypeSelect = document.getElementById('tplType');
      const subjectField = document.getElementById('emailSubjectField');
      if (tplTypeSelect) {
        tplTypeSelect.addEventListener('change', function() {
          const selectedText = tplTypeSelect.options[tplTypeSelect.selectedIndex].text;
          subjectField.style.display = selectedText.includes('EMAIL') ? 'block' : 'none';
        });
      }
    });
  </script>
</th:block>
</html>
