<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(${title}, ${pageTitle}, ${activeKey}, ${pageStatus}, ~{::section}, ~{::scripts})}">
  <section>
    <div class="card">
      <div class="hd">
        <h3>예약 발송 목록</h3>
        <div class="row">
          <span class="tag info">예약된 메시지 리스트</span>
          <span class="tag info">대기 / 완료 / 취소</span>
        </div>
      </div>
      <div class="bd">
        <div class="form">
          <div class="field span-4">
            <label>상태</label>
            <select id="status" class="select-dark">
              <option value="">전체</option>
              <option value="WAITING">대기</option>
              <option value="SENT">완료</option>
              <option value="CANCELED">취소</option>
            </select>
          </div>
          <div class="field span-4">
            <label>템플릿명</label>
            <input id="templateName" placeholder="예: monthly_bill_v1" />
          </div>
          <div class="field span-4">
            <label>대상 그룹</label>
            <input id="groupName" placeholder="예: VIP / ALL / Segment-A" />
          </div>
          <div class="field span-12">
            <div class="row" style="justify-content: flex-end">
              <button class="btn" type="button" id="searchBtn">
                검색
              </button>
              <a class="btn primary" th:href="@{/admin/schedule/new}">예약 등록</a>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="nowrap">예약 ID</th>
                <th>대상 그룹</th>
                <th>템플릿명</th>
                <th class="nowrap">발송 예정 시간</th>
                <th class="nowrap">상태</th>
                <th class="nowrap">액션</th>
              </tr>
            </thead>
            <tbody id="reservationTableBody">
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <div class="page-size">
            <span>페이지 크기</span>
            <select>
              <option>50</option>
              <option selected>100</option>
              <option>200</option>
            </select>
          </div>
          <div class="page-info" id="pageInfo"></div>
          <div class="page-nav" id="pageNav"></div>
        </div>
      </div>
    </div>
  </section>
  <th:block th:fragment="scripts">

    <style>
      /* select 스타일 */
      .select-dark {
        background: #020617;
        color: #e2e8f0;
        border: 1px solid rgba(148,163,184,.25);
      }

      /* disabled 버튼 스타일 */
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
    <script>

      let currentPage = 0;
      let pageSize = 20;

      document.getElementById('searchBtn').addEventListener('click', () => {
        currentPage = 0;
        loadReservations();
      });

      function loadReservations() {
        const status = document.getElementById('status').value;
        const templateName = document.getElementById('templateName').value;
        const groupName = document.getElementById('groupName').value;

        const params = new URLSearchParams({
          page: currentPage,
          size: pageSize
        });

        if (status) params.append('status', status);
        if (templateName) params.append('templateName', templateName);
        if (groupName) params.append('groupName', groupName);

        fetch(`/api/admin/message-reservations?${params.toString()}`)
        .then(res => res.json())
        .then(renderTable);
      }

      function renderTable(page) {
        const tbody = document.getElementById('reservationTableBody');
        tbody.innerHTML = '';

        page.content.forEach(row => {
          const tr = document.createElement('tr');

          tr.innerHTML = `
        <td class="nowrap">${row.reservationId}</td>
        <td>${row.userGroupName}</td>
        <td>${row.templateName}</td>
        <td class="nowrap">${row.scheduledAt.replace('T', ' ')}</td>
        <td>${renderStatus(row.status)}</td>
        <td class="nowrap">
          ${row.status === 'WAITING'
              ? `<button class="btn" onclick="cancel(${row.reservationId})">취소</button>`
              : `<button class="btn" disabled>취소</button>`}
        </td>
      `;
          tbody.appendChild(tr);
        });

        renderPageInfo(page);
        renderPageNav(page);
      }

      function renderStatus(status) {
        if (status === 'WAITING') return '<span class="tag warn">대기</span>';
        if (status === 'SENT') return '<span class="tag ok">완료</span>';
        if (status === 'CANCELED') return '<span class="tag bad">취소</span>';
        return status;
      }

      function renderPageInfo(page) {
        document.getElementById('pageInfo').innerText =
            `총 ${page.totalElements}건 중 ${page.number * page.size + 1} - ${
                Math.min((page.number + 1) * page.size, page.totalElements)
            }건`;
      }

      function renderPageNav(page) {
        const nav = document.getElementById('pageNav');
        nav.innerHTML = '';

        for (let i = 0; i < page.totalPages; i++) {
          const btn = document.createElement('button');
          btn.className = 'btn' + (i === page.number ? ' active' : '');
          btn.innerText = i + 1;
          btn.onclick = () => {
            currentPage = i;
            loadReservations();
          };
          nav.appendChild(btn);
        }
      }


      function cancel(id) {
        if (!confirm('이 예약 발송을 취소하시겠습니까?')) {
          return;
        }

        fetch(`/api/admin/message-reservations/${id}/cancel`, {
          method: 'PATCH'
        })
        .then(res => {
          if (!res.ok) {
            throw new Error('취소 실패');
          }
          alert('예약이 취소되었습니다.');
          loadReservations(); // 목록 새로고침
        })
        .catch(err => {
          alert(err.message);
        });
      }

      // 최초 로딩
      loadReservations();

    </script>
  </th:block>
</html>
